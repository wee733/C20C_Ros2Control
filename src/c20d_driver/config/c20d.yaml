c20d_driver:
  ros__parameters:
    port: /dev/ttyTHS1
    frame_id: c20d_vendor
    update_rate: 100.0
    feedback_timeout: 0.5
    command_timeout: 0.5
    auxiliary_timeout: 0.5
    # radians / radians per second, native vendor sign conventions
    max_rate: 0.5
    roll_limit: 1.0471975511965976
    pitch_limit: 2.0943951023931953
    control_enabled: true
    # FPV pitch target follows relative feedback on the tested upright C20D.
    # Set +1.0 to use the manufacturer's raw command sign.
    fpv_pitch_command_sign: -1.0
